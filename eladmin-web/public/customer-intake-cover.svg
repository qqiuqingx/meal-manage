      <stop offset="58%" stop-color="#1f5f78"/>
      <stop offset="100%" stop-color="#4ea79c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d78b" stop-opacity="0.95"/>
