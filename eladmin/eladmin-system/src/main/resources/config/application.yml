server:
  port: 8000
  http2:
    # 启用 HTTP/2 支持，提升传输效率
    enabled: true
  compression:
    # 启用 GZIP 压缩，减少传输数据量
    enabled: true
    # 需要压缩的 MIME 类型
    mime-types: text/html, text/xml, text/plain, application/json
    # 最小压缩响应大小（字节）
    min-response-size: 1024

mybatis-plus:
  configuration:
    # 关闭二级缓存
    cache-enabled: false
    # 设置本地缓存作用域
    local-cache-scope: SESSION
  # 类型处理器所在包
  type-handlers-package: com.baomidou.mybatisplus.extension.handlers

spring:
  freemarker:
    check-template-location: false
  profiles:
    # 激活的环境，如果需要 quartz 分布式支持，需要修改 active: dev,quartz
    active: dev
  data:
    redis:
      repositories:
        enabled: false
#  pid:
#    file: /自行指定位置/eladmin.pid



task:
  pool:
    # 核心线程池大小
    core-pool-size: 10
    # 最大线程数
    max-pool-size: 30
    # 活跃时间
    keep-alive-seconds: 60
    # 队列容量
    queue-capacity: 50

#邮箱验证码有效时间/秒
code:
  expiration: 300

#密码加密传输，前端公钥加密，后端私钥解密
rsa:
  private_key: ${RSA_PRIVATE_KEY:change-me}

# 企业微信消息回调
# 仅 enabled=true 时才会注册 /api/wecom/callback 接口；
# 启用后 token/corp-id/encoding-aes-key 任一缺失或格式错误都会导致应用启动失败。
# 应用 Secret 不参与回调解密，无需在此配置。
wecom:
  callback:
    # 是否启用回调接口，默认关闭，避免未配置时暴露公网接口
    enabled: ${WECOM_CALLBACK_ENABLED:false}
    # 企业 ID
    corp-id: ${WECOM_CORP_ID:}
    # 企业微信后台「设置 API 接收」中填写的 Token
    token: ${WECOM_CALLBACK_TOKEN:}
    # 企业微信后台生成的 EncodingAESKey（43 位）
    encoding-aes-key: ${WECOM_CALLBACK_AES_KEY:}
