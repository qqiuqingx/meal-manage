server:
  port: 18081

logging:
  path: ${AGENT_LOG_PATH:./logs}

spring:
  application:
    name: agent-service
  http:
    converters:
      preferred-json-mapper: jackson2
  jackson2:
    deserialization:
      fail-on-unknown-properties: true
  ai:
    model:
      chat: deepseek
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
    deepseek:
      api-key: ${AGENT_DEEPSEEK_API_KEY:${AGENT_OPENAI_API_KEY:unused}}
      base-url: ${AGENT_DEEPSEEK_BASE_URL:${AGENT_OPENAI_BASE_URL:https://api.deepseek.com}}
      chat:
        model: ${AGENT_DEEPSEEK_MODEL:${AGENT_OPENAI_MODEL:deepseek-chat}}

agent:
  models:
    providers:
      deepseek:
        enabled: ${AGENT_DEEPSEEK_ENABLED:true}
        protocol: DEEPSEEK
        structured-output: true
        tool-calling: true
      openai-compatible:
        enabled: ${AGENT_FALLBACK_OPENAI_ENABLED:false}
        protocol: OPENAI_COMPATIBLE
        base-url: ${AGENT_FALLBACK_OPENAI_BASE_URL:}
        api-key: ${AGENT_FALLBACK_OPENAI_API_KEY:}
        model: ${AGENT_FALLBACK_OPENAI_MODEL:}
        structured-output: ${AGENT_FALLBACK_OPENAI_STRUCTURED_OUTPUT:true}
        tool-calling: ${AGENT_FALLBACK_OPENAI_TOOL_CALLING:true}
    fallback-order: [openai-compatible]
    profiles:
      default:
        model: ${AGENT_MODEL_DEFAULT:${AGENT_DEEPSEEK_MODEL:${AGENT_OPENAI_MODEL:deepseek-chat}}}
        timeout-ms: ${AGENT_MODEL_DEFAULT_TIMEOUT_MS:3000}
        structured-output: ${AGENT_MODEL_DEFAULT_STRUCTURED_OUTPUT:true}
        tool-calling: ${AGENT_MODEL_DEFAULT_TOOL_CALLING:true}
        max-retries: ${AGENT_MODEL_DEFAULT_MAX_RETRIES:1}
        provider: deepseek
        fallback-providers: [openai-compatible]
      presentation:
        model: ${AGENT_MODEL_PRESENTATION:${AGENT_MODEL_DEFAULT:${AGENT_DEEPSEEK_MODEL:${AGENT_OPENAI_MODEL:deepseek-chat}}}}
        timeout-ms: ${AGENT_MODEL_PRESENTATION_TIMEOUT_MS:1500}
        structured-output: true
        tool-calling: false
        max-retries: ${AGENT_MODEL_PRESENTATION_MAX_RETRIES:0}
        provider: deepseek
        fallback-providers: [openai-compatible]
  rules:
    # 外部目录存在时完整覆盖 classpath 同场景资源，避免规则来源混杂。
    base-path: ${AGENT_RULES_BASE_PATH:rules}
    scene-directories:
      MEAL_PLAN_NOT_GENERATED: meal-plan
  context-base-url: ${AGENT_CONTEXT_BASE_URL:http://localhost:8000}
  internal-token: ${AGENT_INTERNAL_TOKEN:}
  chat:
    tool-loop:
      max-tool-calls: ${AGENT_CHAT_MAX_TOOL_CALLS:6}
      max-model-rounds: ${AGENT_CHAT_MAX_MODEL_ROUNDS:4}
      max-records: ${AGENT_CHAT_MAX_TOOL_RECORDS:100}
      tool-timeout-ms: ${AGENT_CHAT_TOOL_TIMEOUT_MS:3000}
      max-answer-repairs: ${AGENT_CHAT_MAX_ANSWER_REPAIRS:1}
      # 正文可能包含草稿手机号/地址，默认不记录；仅限隔离的非生产排障临时开启。
      log-content: ${AGENT_CHAT_LOG_CONTENT:false}
