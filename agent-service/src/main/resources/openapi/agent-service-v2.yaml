openapi: 3.0.3
info:
  title: agent-service Internal Chat API
  version: v2
  description: 仅供 eladmin-system 调用的可信 Agent 执行契约；前端不得直连。
paths:
  /api/agent/v2/chat:
    post:
      summary: 执行可信聊天请求
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AccessContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentExecutionEnvelope'
      responses:
        '200':
          description: 统一工具调用聊天结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResult'
        '400':
          $ref: '#/components/responses/AgentError'
        '403':
          $ref: '#/components/responses/AgentError'
        '409':
          $ref: '#/components/responses/AgentError'
        '422':
          $ref: '#/components/responses/AgentError'
        '502':
          $ref: '#/components/responses/AgentError'
        '503':
          $ref: '#/components/responses/AgentError'
        '500':
          $ref: '#/components/responses/AgentError'
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    AccessContext:
      name: X-Agent-Access-Context
      in: header
      required: true
      schema: { type: string, writeOnly: true }
  responses:
    AgentError:
      description: 不包含内部实现细节的稳定错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AgentApiError' }
  schemas:
    AgentExecutionEnvelope:
      type: object
      additionalProperties: false
      required: [contractVersion, messageRequest, availableTools, sessionVersion]
      properties:
        contractVersion: { type: string, enum: [v2] }
        messageRequest: { $ref: '#/components/schemas/ChatMessageRequest' }
        contextSnapshot: { $ref: '#/components/schemas/ConversationSummary' }
        availableTools:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, maxLength: 80 }
        lastBusinessQueryContext: { $ref: '#/components/schemas/ControlledSessionSummary' }
        sessionVersion: { type: integer, format: int64, minimum: 0 }
    ChatMessageRequest:
      type: object
      additionalProperties: false
      required: [sessionId, clientMessageId, message]
      properties:
        sessionId: { type: string, minLength: 1, maxLength: 128 }
        clientMessageId: { type: string, minLength: 1, maxLength: 128 }
        message: { type: string, minLength: 1, maxLength: 4000 }
    AgentChatResult:
      type: object
      additionalProperties: false
      required: [contractVersion, requestId, clientMessageId, sessionId, status]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 128 }
        contractVersion: { type: string, enum: [v2] }
        clientMessageId: { type: string, minLength: 1, maxLength: 128 }
        expectedSessionVersion: { type: integer, format: int64, minimum: 0 }
        conversationPatch: { $ref: '#/components/schemas/ConversationPatch' }
        sessionId: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [ANSWERED, ERROR] }
        assistantMessage: { type: string, maxLength: 12000 }
        slots: { $ref: '#/components/schemas/ConversationSummary' }
        diagnosisResult: { type: object, additionalProperties: true }
        quickReplies:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
        conversationStage: { type: string, maxLength: 80 }
        facts:
          type: array
          items: { type: object, additionalProperties: true }
        warnings:
          type: array
          items: { type: string, maxLength: 500 }
        cached: { type: boolean }
        partial: { type: boolean }
        queriedAt: { type: string, format: date-time }
        lastBusinessQueryContext: { $ref: '#/components/schemas/ControlledSessionSummary' }
        cards:
          type: array
          items: { type: object, additionalProperties: true }
        toolFacts:
          type: array
          items: { type: object, additionalProperties: true }
        toolTraceSummary:
          type: array
          items: { type: object, additionalProperties: true }
    ConversationPatch:
      type: object
      additionalProperties: false
      properties:
        slots: { $ref: '#/components/schemas/ConversationSummary' }
        conversationStage: { type: string, maxLength: 80 }
        lastBusinessQueryContext: { $ref: '#/components/schemas/ControlledSessionSummary' }
    ConversationSummary:
      type: object
      additionalProperties: true
      description: 用于指代恢复的最小会话摘要
    ControlledSessionSummary:
      type: object
      additionalProperties: true
      description: 由主系统生成的受控会话摘要，不接受前端直接构造
    AgentApiError:
      type: object
      additionalProperties: false
      required: [code, message, requestId, retryable, details]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, CONTRACT_VERSION_MISMATCH, PERMISSION_DENIED, CAPABILITY_NOT_AVAILABLE,
                 TOOL_NOT_AVAILABLE, SESSION_VERSION_CONFLICT, MODEL_UNAVAILABLE,
                 MODEL_CAPABILITY_UNSUPPORTED, DEPENDENCY_UNAVAILABLE, AGENT_PROCESSING_FAILED]
        message: { type: string, maxLength: 500 }
        requestId: { type: string, maxLength: 128 }
        retryable: { type: boolean }
        details:
          type: object
          additionalProperties: { type: string }
