openapi: 3.0.3
info:
  title: agent-service Internal Chat API
  version: v2
  description: 仅供 eladmin-system 调用的可信 Agent 执行契约；前端不得直连。
paths:
  /api/agent/v2/chat:
    post:
      summary: 执行可信聊天请求
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AccessContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentExecutionEnvelope'
      responses:
        '200':
          description: 统一工具调用聊天结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResult'
        '400':
          $ref: '#/components/responses/AgentError'
        '403':
          $ref: '#/components/responses/AgentError'
        '409':
          $ref: '#/components/responses/AgentError'
        '422':
          $ref: '#/components/responses/AgentError'
        '502':
          $ref: '#/components/responses/AgentError'
        '503':
          $ref: '#/components/responses/AgentError'
        '500':
          $ref: '#/components/responses/AgentError'
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    AccessContext:
      name: X-Agent-Access-Context
      in: header
      required: true
      schema: { type: string, writeOnly: true }
  responses:
    AgentError:
      description: 不包含内部实现细节的稳定错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AgentApiError' }
  schemas:
    AgentExecutionEnvelope:
      type: object
      additionalProperties: false
      required: [contractVersion, messageRequest, availableTools, sessionVersion]
      properties:
        contractVersion: { type: string, enum: [v2] }
        messageRequest: { $ref: '#/components/schemas/ChatMessageRequest' }
        contextSnapshot: { $ref: '#/components/schemas/ConversationSummary' }
        availableTools:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, maxLength: 80 }
        lastBusinessQueryContext: { $ref: '#/components/schemas/ControlledSessionSummary' }
        formDraftContext:
          type: object
          description: 主系统按当前客服、会话和数据范围重新校验的活动表单草稿上下文，仅供 saveFormDraft 修订。
          additionalProperties: true
        sessionVersion: { type: integer, format: int64, minimum: 0 }
    ChatMessageRequest:
      type: object
      additionalProperties: false
      required: [sessionId, clientMessageId, message]
      properties:
        sessionId: { type: string, minLength: 1, maxLength: 128 }
        clientMessageId: { type: string, minLength: 1, maxLength: 128 }
        message: { type: string, minLength: 1, maxLength: 4000 }
    AgentChatResult:
      type: object
      additionalProperties: false
      required: [contractVersion, requestId, clientMessageId, sessionId, status]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 128 }
        contractVersion: { type: string, enum: [v2] }
        clientMessageId: { type: string, minLength: 1, maxLength: 128 }
        expectedSessionVersion: { type: integer, format: int64, minimum: 0 }
        conversationPatch: { $ref: '#/components/schemas/ConversationPatch' }
        sessionId: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [ANSWERED, NEED_MORE_INFO, ERROR] }
        assistantMessage: { type: string, maxLength: 12000 }
        slots: { $ref: '#/components/schemas/ConversationSummary' }
        diagnosisResult: { type: object, additionalProperties: true }
        missingSlots:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [CUSTOMER_OR_ORDER, RECORD_DATE, DATE_RANGE, MEAL_TYPE, PACKAGE, RULE_TOPIC]
        quickReplies:
          type: array
          maxItems: 6
          uniqueItems: true
          items: { type: string, maxLength: 20 }
        conversationStage: { type: string, maxLength: 80 }
        facts:
          type: array
          items: { type: object, additionalProperties: true }
        warnings:
          type: array
          items: { type: string, maxLength: 500 }
        cached: { type: boolean }
        partial: { type: boolean }
        queriedAt: { type: string, format: date-time }
        lastBusinessQueryContext: { $ref: '#/components/schemas/ControlledSessionSummary' }
        cards:
          type: array
          items: { type: object, additionalProperties: true }
        presentations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/PresentationDescriptor' }
        toolFacts:
          type: array
          items: { type: object, additionalProperties: true }
        toolTraceSummary:
          type: array
          items: { type: object, additionalProperties: true }
        formDraftSummary: { $ref: '#/components/schemas/FormDraftSummary' }
        uiActions:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/AgentUiAction' }
    FormDraftSummary:
      type: object
      additionalProperties: false
      required: [draftId, type, status, revision, recognizedFields, missingFields, warnings, expiresAt]
      properties:
        draftId: { type: string, pattern: '^afd_[A-Za-z0-9_-]{16,64}$' }
        type: { type: string, enum: [CREATE_CUSTOMER_WITH_ORDER, CREATE_ORDER] }
        status: { type: string, enum: [EDITABLE, READY, CLAIMED, SUBMITTED, EXPIRED, CANCELLED] }
        revision: { type: integer, minimum: 1 }
        recognizedFields: { type: array, maxItems: 128, items: { type: string, maxLength: 100 } }
        missingFields: { type: array, maxItems: 128, items: { type: string, maxLength: 100 } }
        warnings:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code: { type: string, maxLength: 80 }
              message: { type: string, maxLength: 200 }
        expiresAt: { type: string, maxLength: 40 }
    AgentUiAction:
      type: object
      additionalProperties: false
      required: [type, label, enabled, payload]
      properties:
        type:
          type: string
          enum: [OPEN_CREATE_CUSTOMER_WITH_ORDER_FORM, OPEN_CREATE_ORDER_FORM, CONVERT_TO_CREATE_CUSTOMER_WITH_ORDER]
        label: { type: string, minLength: 1, maxLength: 30 }
        enabled: { type: boolean }
        payload:
          type: object
          additionalProperties: false
          required: [draftId]
          properties:
            draftId: { type: string, pattern: '^afd_[A-Za-z0-9_-]{16,64}$' }
            sourceSessionId: { type: string, minLength: 1, maxLength: 128 }
    PresentationDescriptor:
      type: object
      additionalProperties: false
      required: [schemaVersion, sourceToolCallId, cardType, decisionSource, title, layout, defaultView, availableViews]
      properties:
        schemaVersion: { type: string, enum: [v1] }
        sourceToolCallId: { type: string, minLength: 1, maxLength: 128 }
        cardType: { type: string, minLength: 1, maxLength: 80 }
        decisionSource: { type: string, enum: [SYSTEM, LLM] }
        title: { type: string, minLength: 1, maxLength: 100, pattern: '^[^<>{}]*$' }
        layout: { type: string, enum: [TABS] }
        defaultView: { $ref: '#/components/schemas/PresentationView' }
        availableViews:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/PresentationView' }
        summary: { $ref: '#/components/schemas/PresentationSummary' }
        table: { $ref: '#/components/schemas/PresentationTable' }
        chart: { $ref: '#/components/schemas/PresentationChart' }
    PresentationView:
      type: string
      enum: [TEXT, TABLE, BAR, LINE, PIE]
    PresentationFormat:
      type: string
      enum: [TEXT, DATE, DATE_TIME, STATUS, MEAL_TYPE, NUMBER, BOOLEAN]
    PresentationField:
      type: object
      additionalProperties: false
      required: [field, label, format]
      properties:
        field: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]*(\[\])?(\.[A-Za-z][A-Za-z0-9_]*(\[\])?)*$' }
        label: { type: string, minLength: 1, maxLength: 30, pattern: '^[^<>{}]*$' }
        format: { $ref: '#/components/schemas/PresentationFormat' }
    PresentationSummary:
      type: object
      additionalProperties: false
      required: [dataPath, fields]
      properties:
        dataPath: { type: string, minLength: 1, maxLength: 200 }
        fields:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PresentationField' }
    PresentationTable:
      type: object
      additionalProperties: false
      required: [dataPath, columns, sections]
      properties:
        dataPath: { type: string, minLength: 1, maxLength: 200 }
        columns:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PresentationField' }
        sections:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/PresentationSection' }
    PresentationSection:
      type: object
      additionalProperties: false
      required: [id, title, dataPath, columns]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 100, pattern: '^[^<>{}]*$' }
        dataPath: { type: string, minLength: 1, maxLength: 200 }
        columns:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PresentationField' }
    PresentationChart:
      type: object
      additionalProperties: false
      required: [type, dataPath, dimensionField, metricFields, dimensionLabel, metricLabels]
      properties:
        type: { type: string, enum: [BAR, LINE, PIE] }
        dataPath: { type: string, minLength: 1, maxLength: 200 }
        dimensionField: { type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z][A-Za-z0-9_]*(\[\])?(\.[A-Za-z][A-Za-z0-9_]*(\[\])?)*$' }
        metricFields:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z][A-Za-z0-9_]*(\[\])?(\.[A-Za-z][A-Za-z0-9_]*(\[\])?)*$' }
        dimensionLabel: { type: string, minLength: 1, maxLength: 30, pattern: '^[^<>{}]*$' }
        metricLabels:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: string, minLength: 1, maxLength: 30, pattern: '^[^<>{}]*$' }
    ConversationPatch:
      type: object
      additionalProperties: false
      properties:
        slots: { $ref: '#/components/schemas/ConversationSummary' }
        conversationStage: { type: string, maxLength: 80 }
        lastBusinessQueryContext: { $ref: '#/components/schemas/ControlledSessionSummary' }
    ConversationSummary:
      type: object
      additionalProperties: true
      description: 用于指代恢复的最小会话摘要
    ControlledSessionSummary:
      type: object
      additionalProperties: true
      description: 由主系统生成的受控会话摘要，不接受前端直接构造
    AgentApiError:
      type: object
      additionalProperties: false
      required: [code, message, requestId, retryable, details]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, CONTRACT_VERSION_MISMATCH, PERMISSION_DENIED, CAPABILITY_NOT_AVAILABLE,
                 TOOL_NOT_AVAILABLE, SESSION_VERSION_CONFLICT, MODEL_UNAVAILABLE,
                 MODEL_CAPABILITY_UNSUPPORTED, DEPENDENCY_UNAVAILABLE, AGENT_PROCESSING_FAILED]
        message: { type: string, maxLength: 500 }
        requestId: { type: string, maxLength: 128 }
        retryable: { type: boolean }
        details:
          type: object
          additionalProperties: { type: string }
